# Einstellungen fuer das Hauptprogramm. Format: schluessel = wert, Kommentare mit #.
# Die Kalibrierung der Waegezelle steht in kalibrierung.conf (wird vom Befehl "kalibrieren" geschrieben).

# --- Mechanik ---
motor_schritte = 200              # Vollschritte pro Umdrehung (Beckhoff AS1020: 1,8 Grad = 200)
mikroschritte = 8                 # TMC2209 ohne UART, MS1/MS2 offen: 1/8
untersetzung = 3                  # Riemen 20 -> 60 Zaehne
spindelsteigung_mm = 2            # Trapezspindel T8x2
verfahrweg_mm = 100               # erlaubter Weg ab Endschalter
richtung_umkehren = 0             # 1, wenn "vorwaerts" vom Endschalter weg falsch herum laeuft
zug_vom_endschalter_weg = 1       # 1: Zug faehrt vom Endschalter weg, 0: zum Endschalter hin

# --- Geschwindigkeiten ---
max_geschwindigkeit_mm_s = 2      # AS1020 bei 24 V: bis ca. 240 U/min volles Drehmoment
referenz_geschwindigkeit_mm_s = 1
beschleunigung_mm_s2 = 5
freifahren_mm = 1                 # nach der Referenzfahrt vom Endschalter wegfahren

# --- Sicherheit und Pruefung ---
kraft_grenze_n = 550              # darueber sofort Halt (Waegezelle 100 kg, Mechanik 500 N)
bruch_mindestkraft_n = 5          # Bruch erst ab dieser Spitzenkraft erkennen
waegezelle_mittelwert = 4         # Anzahl Messwerte fuer den gleitenden Mittelwert

# --- Waegezelle (HX711) ---
waegezelle_faktor = 0.0001        # N pro Rohwert-Einheit, mit "kalibrieren" bestimmen

# --- GPIO (BCM-Nummern), Raspberry Pi 4 ---
gpio_chip = /dev/gpiochip0
pin_step = 20
pin_dir = 21
pin_enable = 16                   # TMC2209: EN aktiv LOW
pin_endschalter = 26              # Schalter nach GND, interner Pull-up
pin_hx711_dout = 5
pin_hx711_sck = 6

# --- CSV-Export auf USB-Stick ---
usb_ordner = /media                # hier haengt Raspberry Pi OS Sticks ein

# --- Verbindung zum Webserver ---
port = 7000

# --- Simulation (nur mit --sim) ---
sim_startposition_mm = 10         # Schlitten beim Programmstart
sim_probe_mm = 1                  # ab hier ist die Probe gespannt (nach der Referenzfahrt)
sim_steifigkeit_n_mm = 50
sim_bruch_bei_n = 400
