<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Prüfstand</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font: 15px/1.4 system-ui, sans-serif;
    /* Platz fuer Statusleiste und Kamera-Punkt lassen */
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px)
             calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px);
    display: flex; flex-direction: column; height: 100dvh;
  }
  h1 { font-size: 20px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  #zustand { font-size: 14px; padding: 4px 10px; border-radius: 999px; background: #444; }
  #zustand.PRUEFUNG, #zustand.REFERENZFAHRT, #zustand.POSITIONIEREN { background: #2a6; }
  #zustand.FEHLER { background: #c33; } #zustand.ENDE { background: #36c; }
  #status, #live, #ergebnis { background: #222; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  #live { background: #1d2a3a; } #ergebnis { background: #1d2a3a; } #ergebnis:empty { display: none; }
  .werte { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .wert { background: #222; border-radius: 8px; padding: 6px 10px; }
  .wert small { color: #999; display: block; } .wert b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .tasten { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  details { background: #222; border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; }
  details label { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
  details input, details select { font: inherit; width: 8em; padding: 4px; background: #111; color: #eee; border: 1px solid #444; border-radius: 4px; }
  #log { flex: 1; min-height: 6em; overflow-y: auto; margin: 0; padding: 0; list-style: none; font-variant-numeric: tabular-nums; }
  #log li { padding: 3px 0; border-bottom: 1px solid #222; }
  .warn { color: #fc6; } .err { color: #f77; }
  button { font: inherit; padding: 12px 6px; border: 0; border-radius: 8px; background: #2a6; color: #fff; }
  button.neben { background: #345; } button:disabled { opacity: .35; }
  #nothalt { background: #c33; font-weight: bold; width: 100%; margin-top: 8px; }
</style>
</head>
<body>
<h1>Prüfstand <span id="zustand">Verbinde …</span></h1>
<div class="werte">
  <div class="wert"><small>Kraft</small><b id="kraft">–</b> N</div>
  <div class="wert"><small>Weg</small><b id="weg">–</b> mm</div>
  <div class="wert"><small>Spitzenkraft</small><b id="spitze">–</b> N</div>
  <div class="wert"><small>Position</small><b id="position">–</b> mm</div>
</div>
<div id="ergebnis"></div>
<div class="tasten">
  <button id="pruefStart">▶ Start</button>
  <button id="pruefStopp" class="neben">■ Stopp</button>
  <button id="quittieren" class="neben">Quittieren</button>
  <button id="referenz" class="neben">Referenz</button>
  <button id="tara" class="neben">Tara</button>
  <button id="start" class="neben">Kamera an</button>
  <button id="zurueck" class="neben">◀ 1 mm</button>
  <button id="vor" class="neben">1 mm ▶</button>
  <button id="uebernehmen" class="neben">Parameter ✓</button>
</div>
<details>
  <summary>Prüfparameter</summary>
  <label>Modus <select id="p-modus"><option value="zug">Zug</option><option value="druck">Druck</option></select></label>
  <label>Geschwindigkeit (mm/min) <input id="p-geschwindigkeit" type="number" step="any" inputmode="decimal"></label>
  <label>Maximalkraft (N) <input id="p-maxkraft" type="number" step="any" inputmode="decimal"></label>
  <label>Maximalweg (mm) <input id="p-maxweg" type="number" step="any" inputmode="decimal"></label>
  <label>Bruch bei Abfall um (%) <input id="p-bruch" type="number" step="any" inputmode="decimal"></label>
</details>
<div id="live">Auswertung: –</div>
<div id="status">Kamera aus</div>
<ul id="log"></ul>
<button id="nothalt">NOT-HALT</button>

<script>
const WIDTH = 1920, HEIGHT = 1080, FPS = 30;
const BITRATE = 8_000_000;   // 8 Mbit/s, passt per Kabel und per WLAN
const CHUNK_MS = 1000;       // jede Sekunde ein Teil
// Live-Bild fuer die Auswertung auf dem Pi. Zum Messen in voller Aufloesung: WebRTC darf bei Engpaessen
// nur die Bildrate senken, nie die Aufloesung. 15 Bilder/s reichen zum Messen und schonen den Pi 4.
const LIVE_HEIGHT = 1080;
const LIVE_FPS = 15;
const LIVE_BITRATE = 8_000_000;

const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const liveEl = document.getElementById('live');
const startBtn = document.getElementById('start');

let recorder, stream, ws, wakeLock, pc, liveTrack;
let session, ext, seq = 0, queue = [], sentBytes = 0, startedAt = 0, settings = {};

function log(text, cls = '') {
  const li = document.createElement('li');
  li.className = cls;
  li.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
  logEl.prepend(li);
  while (logEl.children.length > 500) logEl.lastChild.remove();
}

function pickMime() {
  const candidates = ['video/webm;codecs=h264', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8',
                      'video/webm', 'video/mp4;codecs=avc1', 'video/mp4'];
  return candidates.find(m => MediaRecorder.isTypeSupported(m));
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/stream?session=${session}&ext=${ext}`);
  ws.onopen = () => {
    log(queue.length ? `Verbunden, sende ${queue.length} wartende Teile` : 'Verbunden mit dem Pi');
    queue.forEach(sendChunk);
  };
  ws.onmessage = e => {
    const ack = JSON.parse(e.data);
    queue = queue.filter(c => c.seq > ack.seq);
    log(`✅ Teil ${ack.seq} gespeichert (${(ack.total / 1e6).toFixed(1)} MB gesamt)`);
  };
  ws.onclose = () => {
    if (!recorder || recorder.state === 'inactive') return;
    log('⚠️ Verbindung weg, neuer Versuch in 2 s', 'warn');
    setTimeout(connect, 2000);
  };
}

function sendChunk(c) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const head = new DataView(new ArrayBuffer(4));
  head.setUint32(0, c.seq);
  ws.send(new Blob([head.buffer, c.data]));
}

function recording() {
  return recorder && recorder.state !== 'inactive';
}

// Live-Bild per WebRTC an die Auswertung auf dem Pi; deren Ergebnisse kommen ueber den Datenkanal zurueck.
async function startLive() {
  if (!recording()) return;
  pc?.close();
  liveTrack?.stop();
  const conn = pc = new RTCPeerConnection({ iceServers: [] });
  const retry = () => {
    if (pc !== conn || !recording()) return;
    log('⚠️ Live-Bild unterbrochen, neuer Versuch in 3 s', 'warn');
    liveEl.textContent = 'Auswertung: getrennt';
    pc = null;
    conn.close();
    setTimeout(startLive, 3000);
  };
  try {
    // Eigene Kopie der Kamera, damit der Hinweis "detail" (scharfe Kanten statt fluessiger Bewegung)
    // nur das Live-Bild betrifft und nicht die Aufnahme.
    liveTrack = stream.getVideoTracks()[0].clone();
    if ('contentHint' in liveTrack) liveTrack.contentHint = 'detail';
    const scale = Math.max(1, (settings.height || LIVE_HEIGHT) / LIVE_HEIGHT);
    const { sender } = conn.addTransceiver(liveTrack, { direction: 'sendonly',
      sendEncodings: [{ scaleResolutionDownBy: scale, maxBitrate: LIVE_BITRATE, maxFramerate: LIVE_FPS }] });
    const dc = conn.createDataChannel('info');
    dc.onopen = () => log(`Live-Bild an Auswertung (${Math.round(settings.width / scale)}×${Math.round(settings.height / scale)})`);
    dc.onmessage = e => { liveEl.textContent = `Auswertung: ${e.data}`; };
    conn.onconnectionstatechange = () => { if (conn.connectionState === 'failed') retry(); };

    await conn.setLocalDescription(await conn.createOffer());
    await new Promise(resolve => {
      conn.onicegatheringstatechange = () => conn.iceGatheringState === 'complete' && resolve();
      if (conn.iceGatheringState === 'complete') resolve();
      setTimeout(resolve, 2000);
    });
    const res = await fetch('/offer', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify(conn.localDescription) });
    if (!res.ok) throw new Error(`Pi antwortet ${res.status}`);
    await conn.setRemoteDescription(await res.json());
    try {
      const params = sender.getParameters();
      params.degradationPreference = 'maintain-resolution';
      await sender.setParameters(params);
    } catch { /* aeltere Browser: contentHint 'detail' wirkt trotzdem */ }
  } catch (e) {
    log(`⚠️ Live-Bild: ${e.message}`, 'warn');
    retry();
  }
}

async function keepScreenOn() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); }
  catch (e) { log(`Bildschirm-Sperre nicht verhindert: ${e.message}`, 'warn'); }
}

async function start() {
  const mime = pickMime();
  if (!mime) { log('❌ Dieser Browser kann kein Video aufnehmen', 'err'); return; }
  ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: 'environment', width: { ideal: WIDTH }, height: { ideal: HEIGHT }, frameRate: { ideal: FPS } },
    });
  } catch (e) {
    log(`❌ Kamera nicht erlaubt: ${e.message}`, 'err');
    return;
  }

  const track = stream.getVideoTracks()[0];
  settings = track.getSettings();
  track.onended = () => { log('❌ Kamera wurde beendet', 'err'); stop(); };
  log(`Kamera: ${settings.width}×${settings.height}, ${Math.round(settings.frameRate)} Bilder/s, ${mime}`);

  session = new Date().toISOString().replace(/[:.]/g, '-');
  seq = 0; queue = []; sentBytes = 0; startedAt = Date.now();

  // Kein <video>-Element: die Kamera wird aufgenommen, aber nie angezeigt.
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: BITRATE });
  recorder.ondataavailable = e => {
    if (!e.data.size) return;
    const c = { seq: ++seq, data: e.data };
    queue.push(c);
    sentBytes += e.data.size;
    sendChunk(c);
  };
  recorder.start(CHUNK_MS);
  connect();
  keepScreenOn();
  startLive();
  startBtn.textContent = 'Kamera aus';
  log(`Aufnahme ${session} gestartet`);
}

function stop() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  stream?.getTracks().forEach(t => t.stop());
  wakeLock?.release();
  pc?.close();
  pc = null;
  liveTrack?.stop();
  liveEl.textContent = 'Auswertung: –';
  startBtn.textContent = 'Kamera an';
  statusEl.textContent = `⏹ gestoppt · ${(sentBytes / 1e6).toFixed(1)} MB aufgenommen`;
  log('Aufnahme gestoppt');
}

startBtn.onclick = () => (recorder && recorder.state !== 'inactive') ? stop() : start();

document.addEventListener('visibilitychange', () => {
  if (document.hidden) log('⚠️ Seite im Hintergrund – Kamera pausiert', 'warn');
  else if (recorder && recorder.state !== 'inactive') keepScreenOn();
});

// --- Steuerung (C++-Hauptprogramm auf dem Pi) ---

const $ = id => document.getElementById(id);
const PARAMETER = ['modus', 'geschwindigkeit', 'maxkraft', 'maxweg', 'bruch'];
let steuerung, zustand = '';

function befehl(text) {
  if (steuerung?.readyState === WebSocket.OPEN) steuerung.send(text);
  else log('⚠️ Keine Verbindung zur Steuerung', 'warn');
}

function zeigeStatus(s) {
  zustand = s.zustand;
  $('zustand').textContent = s.zustand + (s.referenziert ? '' : ' · nicht referenziert');
  $('zustand').className = s.zustand;
  $('kraft').textContent = s.kraft.toFixed(1);
  $('weg').textContent = s.weg.toFixed(3);
  $('spitze').textContent = s.spitze.toFixed(1);
  $('position').textContent = s.position.toFixed(3);
  $('ergebnis').textContent = s.ergebnis ? `${s.ergebnis}${s.datei ? ' · ' + s.datei : ''}` : '';

  // Felder nur nachfuehren, solange niemand darin tippt
  for (const name of PARAMETER) {
    const feld = $('p-' + name);
    if (document.activeElement !== feld && !feld.dataset.geaendert) feld.value = s[name];
  }

  const still = ['BEREIT', 'ENDE'].includes(s.zustand);
  $('pruefStart').disabled = !(still && s.referenziert);
  $('pruefStopp').disabled = !['PRUEFUNG', 'REFERENZFAHRT', 'POSITIONIEREN'].includes(s.zustand);
  $('quittieren').disabled = !['FEHLER', 'ENDE'].includes(s.zustand);
  $('referenz').disabled = !(still || s.zustand === 'UNREFERENZIERT');
  $('tara').disabled = s.zustand === 'PRUEFUNG';
  $('vor').disabled = $('zurueck').disabled = !(still && s.referenziert);
  $('uebernehmen').disabled = s.zustand === 'PRUEFUNG';
}

function verbindeSteuerung() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  steuerung = new WebSocket(`${proto}://${location.host}/steuerung`);
  steuerung.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.typ === 'status') zeigeStatus(m);
    else if (m.typ === 'ereignis') {
      const cls = /Fehler|Abgelehnt|verloren|nicht erreichbar/.test(m.text) ? 'err' : '';
      log(m.text.startsWith('Pruefung beendet') ? '✅ ' + m.text : m.text, cls);
    }
  };
  steuerung.onclose = () => {
    $('zustand').textContent = 'Keine Verbindung';
    $('zustand').className = 'FEHLER';
    setTimeout(verbindeSteuerung, 2000);
  };
}

for (const name of PARAMETER) $('p-' + name).oninput = e => { e.target.dataset.geaendert = '1'; };

$('uebernehmen').onclick = () => {
  for (const name of PARAMETER) {
    const feld = $('p-' + name);
    if (feld.dataset.geaendert) befehl(`set ${name} ${feld.value}`);
    delete feld.dataset.geaendert;
  }
  log('Parameter gesendet');
};
$('pruefStart').onclick = async () => {
  // Die Kamera laeuft bei jeder Pruefung mit; der Tipp auf Start erlaubt sie auch auf dem iPhone.
  if (!recording()) await start();
  befehl('start');
};
$('pruefStopp').onclick = () => befehl('stopp');
$('quittieren').onclick = () => befehl('quittieren');
$('referenz').onclick = () => befehl('referenz');
$('tara').onclick = () => befehl('tara');
$('vor').onclick = () => befehl('fahren 1');
$('zurueck').onclick = () => befehl('fahren -1');
$('nothalt').onclick = () => befehl('nothalt');

verbindeSteuerung();

setInterval(() => {
  if (!recorder || recorder.state === 'inactive') return;
  const secs = (Date.now() - startedAt) / 1000;
  const online = ws && ws.readyState === WebSocket.OPEN;
  statusEl.textContent =
    `${online ? '🟢 läuft' : '🟠 offline'} · ${Math.floor(secs / 60)}:${String(Math.floor(secs % 60)).padStart(2, '0')}` +
    ` · ${settings.width}×${settings.height} · ${(sentBytes / 1e6).toFixed(1)} MB` +
    ` · ${(sentBytes * 8 / secs / 1e6).toFixed(1)} Mbit/s · wartend: ${queue.length}`;
}, 1000);
</script>
</body>
</html>
